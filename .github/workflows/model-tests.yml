name: Offline Java model verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  models:
    name: JDK 11 models, JUnit and XML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Prepare checksum-pinned Maven Central dependencies
        run: python3 tests-offline/Verify.py --prepare-dependencies --prepare-only
      - name: Verify offline with preinstalled Android platform
        run: python3 tests-offline/Verify.py
